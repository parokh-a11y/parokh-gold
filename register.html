<div class="auth-page"><div class="auth-card">
<img src="images/logo-header.png" alt="" width="48" height="48" style="margin:0 auto 16px;display:block;border-radius:10px">
<h1 data-i18n="reg_title">ثبت‌نام</h1>
<p class="sub" data-i18n="reg_subtitle"></p>
<form id="reg-form">
<div class="form-field"><label data-i18n="reg_name"></label><input type="text" id="name" required autocomplete="name"></div>
<div class="form-field"><label data-i18n="login_email"></label><input type="email" id="email" required autocomplete="email"></div>
<div class="form-field"><label data-i18n="login_password"></label><input type="password" id="password" class="with-eye" required minlength="6" autocomplete="new-password"></div>
<p id="auth-msg" style="display:none;font-size:.9rem;margin-bottom:12px"></p>
<button type="submit" class="btn btn-primary" style="width:100%" id="reg-btn" data-i18n="reg_btn">ایجاد حساب</button>
</form>
<p class="auth-divider" data-i18n="login_or"></p>
<a href="login.html" class="btn btn-secondary" style="width:100%;display:flex" data-i18n="nav_login"></a>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("reg-form").addEventListener("submit", async function(e){
  e.preventDefault();
  var msg=document.getElementById("auth-msg"), btn=document.getElementById("reg-btn");
  var isFa=document.body.classList.contains("rtl");
  msg.style.display="none"; btn.disabled=true;
  try {
    var res=await getParokhSupabase().auth.signUp({
      email:document.getElementById("email").value.trim(),
      password:document.getElementById("password").value,
      options:{ data:{ full_name:document.getElementById("name").value.trim() } }
    });
    if(res.error) throw res.error;
    msg.style.display="block"; msg.style.color="#4ade80";
    if(res.data.session){
      msg.textContent=isFa?"ثبت‌نام موفق — در حال ورود...":"Success — signing in...";
      setTimeout(function(){ location.href="dashboard.html"; },700);
    } else {
      msg.textContent=isFa?"ثبت‌نام انجام شد. اگر تأیید ایمیل لازم است صندوق ورودی را چک کنید.":"Registered. Check email if confirmation is required.";
      btn.disabled=false;
    }
  } catch(err) {
    msg.style.display="block"; msg.style.color="#f87171";
    msg.textContent=parokhAuthErrorMessage(err,isFa); btn.disabled=false;
  }
});
</script>
