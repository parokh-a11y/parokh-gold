<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Purchase | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo-header.png" type="image/png">
</head>
<body class="rtl">
<header class="header"><div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo-header.png" alt="PAROKH GOLD EA" class="logo-img" width="34" height="34"><span>PAROKH GOLD EA</span></a>
<nav class="nav"><a href="index.html" data-i18n="nav_home">خانه</a><a href="dashboard.html" data-i18n="nav_dashboard">پنل کاربری</a></nav>
<div class="header-actions">
<button class="btn-icon" data-lang-toggle><span class="lang-label">🌐</span></button>
<button class="btn-icon" data-theme-toggle><span class="theme-icon">☀️</span></button>
</div></div></header>
<div class="dash-wrap"><div class="container" style="max-width:640px">
<h1 data-i18n="pay_title" style="margin-bottom:8px"></h1>
<p style="color:var(--text-secondary);margin-bottom:20px" data-i18n="pay_subtitle"></p>
<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="disclaimer_title"></h3>
<div class="disclaimer-box" style="margin:12px 0">
<ul style="padding-inline-start:20px;color:var(--text-secondary);font-size:0.9rem;line-height:1.75">
<li data-i18n="disclaimer_1"></li><li data-i18n="disclaimer_2"></li><li data-i18n="disclaimer_3"></li>
<li data-i18n="disclaimer_4"></li><li data-i18n="disclaimer_5"></li><li data-i18n="disclaimer_6"></li>
</ul>
</div>
<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:12px">
<input type="checkbox" id="accept"><span data-i18n="pay_accept"></span>
</label>
</div>
<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="pay_methods"></h3>
<p style="color:var(--text-secondary);font-size:.9rem;margin:8px 0" data-i18n="pay_note"></p>
<button type="button" class="btn btn-primary" style="width:100%;margin-top:8px;opacity:.4;pointer-events:none" id="pay-iran" data-i18n="pay_iran"></button>
<button type="button" class="btn btn-secondary" style="width:100%;margin-top:10px;opacity:.4;pointer-events:none" id="pay-crypto" data-i18n="pay_crypto"></button>
<p id="pay-msg" style="display:none;margin-top:12px;color:#4ade80;font-size:.9rem"></p>
</div>
<p><a href="dashboard.html" class="btn btn-secondary btn-sm" data-i18n="nav_dashboard"></a></p>
</div></div>
<script src="lang/fa.js"></script><script src="lang/en.js"></script><script src="js/main.js"></script>
<script>
(function(){
  var email = localStorage.getItem('parokh_session');
  if(!email){ location.href='login.html'; return; }
  var deleted = JSON.parse(localStorage.getItem('parokh_deleted_users')||'{}');
  if(deleted[email]){ localStorage.removeItem('parokh_session'); location.href='login.html'; return; }
  var acc = document.getElementById('accept');
  var buttons = [document.getElementById('pay-iran'), document.getElementById('pay-crypto')];
  function sync(){
    var on = acc.checked;
    buttons.forEach(function(b){ b.style.opacity = on ? '1' : '.4'; b.style.pointerEvents = on ? 'auto' : 'none'; });
  }
  acc.addEventListener('change', sync);
  function submitOrder(method){
    if(!acc.checked) return;
    var orders = JSON.parse(localStorage.getItem('parokh_orders')||'{}');
    var requests = JSON.parse(localStorage.getItem('parokh_license_requests')||'{}');
    var users = JSON.parse(localStorage.getItem('parokh_users')||'{}');
    orders[email] = { email: email, method: method, at: Date.now(), status: 'pending_payment' };
    requests[email] = { email: email, name: (users[email]&&users[email].name)||'', at: Date.now(), status: 'pending', source: 'purchase' };
    localStorage.setItem('parokh_orders', JSON.stringify(orders));
    localStorage.setItem('parokh_license_requests', JSON.stringify(requests));
    var isFa = document.body.classList.contains('rtl');
    var msg = document.getElementById('pay-msg');
    msg.style.display = 'block';
    msg.textContent = isFa ? (fa.pay_submitted||'سفارش ثبت شد') : (en.pay_submitted||'Order recorded');
  }
  document.getElementById('pay-iran').onclick = function(){ submitOrder('iran'); };
  document.getElementById('pay-crypto').onclick = function(){ submitOrder('crypto'); };
})();
</script>
</body></html>
