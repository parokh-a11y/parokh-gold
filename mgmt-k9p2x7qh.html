<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Management | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo-header.png">
</head>
<body class="rtl">
<header class="header"><div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo-header.png" alt="PAROKH GOLD EA" class="logo-img" width="34" height="34"><span>PAROKH GOLD EA</span></a>
<div class="header-actions">
<a href="index.html" class="btn btn-secondary btn-sm" data-i18n="nav_home">خانه</a>
<button class="btn-icon" data-lang-toggle type="button"><span class="lang-label">🌐</span></button>
<button class="btn-icon" data-theme-toggle type="button"><span class="theme-icon">☀️</span></button>
</div></div></header>

<div class="dash-wrap"><div class="container">
<div id="admin-login" class="auth-page" style="padding-top:40px">
<div class="auth-card">
<h1 data-i18n="admin_login_title">ورود مدیر</h1>
<p class="sub" data-i18n="admin_login_sub"></p>
<div class="form-field"><label data-i18n="admin_pass"></label><input type="password" id="admin-pass" class="with-eye" autocomplete="current-password"></div>
<p id="admin-err" style="display:none;color:#f87171;font-size:.9rem;margin-bottom:12px"></p>
<button class="btn btn-primary" style="width:100%" id="admin-enter" data-i18n="admin_enter">ورود</button>
</div>
</div>

<div id="admin-app" style="display:none">
<div class="section-header" style="text-align:start;max-width:none">
<h2 data-i18n="admin_title">پنل مدیریت</h2>
<p style="color:var(--text-secondary)" data-i18n="admin_sub"></p>
</div>
<div class="admin-stats">
<div class="admin-stat"><div class="num" id="st-keys">0</div><div class="lbl" data-i18n="admin_stat_keys"></div></div>
<div class="admin-stat"><div class="num" id="st-active">0</div><div class="lbl" data-i18n="admin_stat_full"></div></div>
<div class="admin-stat"><div class="num" id="st-demo">0</div><div class="lbl" data-i18n="admin_stat_demo"></div></div>
</div>
<div class="dash-grid">
<div class="dash-card" style="grid-column:1/-1">
<h3 data-i18n="admin_issue"></h3>
<p data-i18n="admin_issue_hint"></p>
<div class="form-field"><label data-i18n="admin_email"></label><input type="email" id="lic-email"></div>
<div class="form-field"><label data-i18n="admin_type"></label>
<select id="lic-type" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:inherit">
<option value="full" data-i18n="admin_type_full">حرفه‌ای (کامل)</option>
<option value="demo" data-i18n="admin_type_demo">دمو</option>
</select>
</div>
<button class="btn btn-primary btn-sm" id="lic-gen" data-i18n="admin_gen"></button>
<p id="lic-out" class="license-box" style="margin-top:14px;display:none"></p>
</div>
<div class="dash-card" style="grid-column:1/-1">
<h3 data-i18n="admin_list"></h3>
<div style="overflow-x:auto">
<table class="admin-table" id="lic-table">
<thead><tr><th data-i18n="admin_email"></th><th data-i18n="admin_type"></th><th>Key</th><th></th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
<div class="dash-card">
<h3 data-i18n="admin_users"></h3>
<p data-i18n="admin_users_hint"></p>
<a class="btn btn-secondary btn-sm" href="https://supabase.com/dashboard/project/kklgwyldzpimtzdaleq/auth/users" target="_blank" rel="noopener" data-i18n="admin_open_users"></a>
</div>
<div class="dash-card">
<h3 data-i18n="admin_logout"></h3>
<button class="btn btn-secondary btn-sm" id="admin-logout" data-i18n="admin_logout"></button>
</div>
</div>
<p style="margin-top:28px"><a href="index.html" class="btn btn-secondary" data-i18n="admin_back"></a></p>
</div>
</div></div>

<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script><script src="lang/en.js"></script><script src="js/main.js"></script>
<script>
(function(){
  var ADMIN_PASS = "ParokhAdmin2026!";
  var KEY = "parokh_admin_ok";
  var LIC_KEY = "parokh_admin_licenses";
  function loadLics(){ try { return JSON.parse(localStorage.getItem(LIC_KEY)||"[]"); } catch(e){ return []; } }
  function saveLics(arr){ localStorage.setItem(LIC_KEY, JSON.stringify(arr)); }
  function t(k){
    var isFa = document.body.classList.contains("rtl");
    var dict = isFa ? (window.i18nFa||window.fa||{}) : (window.i18nEn||window.en||{});
    // support LANG.fa / LANG.en patterns
    if (window.LANG_FA) dict = isFa ? window.LANG_FA : window.LANG_EN;
    if (window.translations) dict = isFa ? window.translations.fa : window.translations.en;
    if (window.fa && window.en) dict = isFa ? window.fa : window.en;
    if (typeof I18N !== "undefined") dict = isFa ? I18N.fa : I18N.en;
    return (dict && dict[k]) || k;
  }
  function render(){
    var list = loadLics();
    document.getElementById("st-keys").textContent = list.length;
    document.getElementById("st-active").textContent = list.filter(function(x){return x.type==="full";}).length;
    document.getElementById("st-demo").textContent = list.filter(function(x){return x.type==="demo";}).length;
    var tb = document.querySelector("#lic-table tbody");
    var empty = document.body.classList.contains("rtl") ? "هنوز لایسنسی صادر نشده" : "No licenses issued yet";
    tb.innerHTML = list.length ? list.map(function(x,i){
      return "<tr><td>"+x.email+"</td><td>"+x.type+"</td><td style=\"font-family:monospace;font-size:.8rem\">"+x.key+"</td><td><button data-i=\""+i+"\" class=\"btn btn-secondary btn-sm del-lic\">×</button></td></tr>";
    }).join("") : "<tr><td colspan=\"4\">"+empty+"</td></tr>";
    tb.querySelectorAll(".del-lic").forEach(function(b){
      b.onclick=function(){ var arr=loadLics(); arr.splice(+b.getAttribute("data-i"),1); saveLics(arr); render(); };
    });
  }
  function showApp(){
    document.getElementById("admin-login").style.display="none";
    document.getElementById("admin-app").style.display="block";
    render();
  }
  if(sessionStorage.getItem(KEY)==="1") showApp();
  document.getElementById("admin-enter").onclick=function(){
    var p=document.getElementById("admin-pass").value;
    var err=document.getElementById("admin-err");
    if(p===ADMIN_PASS){ sessionStorage.setItem(KEY,"1"); showApp(); }
    else { err.style.display="block"; err.textContent=document.body.classList.contains("rtl")?"رمز اشتباه است":"Wrong password"; }
  };
  document.getElementById("admin-pass").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("admin-enter").click(); });
  document.getElementById("admin-logout").onclick=function(){ sessionStorage.removeItem(KEY); location.reload(); };
  document.getElementById("lic-gen").onclick=function(){
    var email=document.getElementById("lic-email").value.trim();
    var type=document.getElementById("lic-type").value;
    if(!email){ alert(document.body.classList.contains("rtl")?"ایمیل لازم است":"Email required"); return; }
    var key="PG-"+type.toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Date.now().toString(36).toUpperCase();
    var arr=loadLics(); arr.unshift({email:email,type:type,key:key,at:Date.now()}); saveLics(arr);
    var out=document.getElementById("lic-out"); out.style.display="block"; out.textContent=key; render();
  };
})();
</script>
</body></html>
