<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Management | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo-header.png" type="image/png">
</head>
<body class="rtl">
<header class="header"><div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo-header.png" alt="PAROKH GOLD EA" class="logo-img" width="34" height="34"><span>PAROKH GOLD EA</span></a>
<div class="header-actions">
<a href="index.html" class="btn btn-secondary btn-sm" data-i18n="nav_home">خانه</a>
<button class="btn-icon" data-lang-toggle><span class="lang-label">🌐</span></button>
<button class="btn-icon" data-theme-toggle><span class="theme-icon">☀️</span></button>
</div></div></header>

<div class="dash-wrap"><div class="container">
<div id="gate" class="auth-page" style="min-height:50vh;padding-top:40px">
<div class="auth-card">
<img src="images/logo-header.png" alt="" style="width:48px;height:48px;margin:0 auto 16px;display:block;border-radius:10px">
<h1 data-i18n="admin_title">پنل مدیریت</h1>
<p class="sub" data-i18n="admin_sub"></p>
<div class="form-field"><label data-i18n="admin_pass"></label><input type="password" id="pw" class="with-eye"></div>
<p id="err" style="display:none;color:#f87171;font-size:.9rem" data-i18n="admin_wrong"></p>
<button class="btn btn-primary" style="width:100%" id="go" data-i18n="admin_enter">ورود</button>
</div></div>

<div id="app" style="display:none">
<div class="section-header" style="text-align:start;max-width:none;margin-bottom:8px">
<h2 data-i18n="admin_title"></h2>
<p style="color:var(--text-secondary)" data-i18n="admin_sub"></p>
</div>
<div class="admin-stats">
<div class="admin-stat"><div class="num" id="n-users">0</div><div data-i18n="admin_users"></div></div>
<div class="admin-stat"><div class="num" id="n-lic">0</div><div data-i18n="admin_licenses"></div></div>
<div class="admin-stat"><div class="num" id="n-req">0</div><div data-i18n="admin_requests"></div></div>
</div>

<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="admin_users"></h3>
<table class="admin-table"><thead><tr>
<th data-i18n="admin_email"></th><th data-i18n="admin_name"></th><th data-i18n="admin_actions"></th>
</tr></thead><tbody id="tb-users"></tbody></table>
</div>

<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="admin_requests"></h3>
<table class="admin-table"><thead><tr>
<th data-i18n="admin_email"></th><th data-i18n="admin_name"></th><th data-i18n="admin_actions"></th>
</tr></thead><tbody id="tb-req"></tbody></table>
</div>

<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="admin_issue"></h3>
<div class="form-field"><label data-i18n="admin_email"></label><input type="email" id="iss-email"></div>
<div class="form-field"><label data-i18n="admin_type"></label>
<select id="iss-type"><option value="full" data-i18n="admin_full">حرفه‌ای</option><option value="demo" data-i18n="admin_demo">دمو</option></select>
</div>
<button class="btn btn-primary btn-sm" id="iss-btn" data-i18n="admin_issue"></button>
<p id="iss-out" class="license-box" style="display:none;margin-top:10px"></p>
</div>

<div class="dash-card" style="margin-bottom:16px">
<h3 data-i18n="admin_licenses"></h3>
<table class="admin-table"><thead><tr>
<th data-i18n="admin_email"></th><th data-i18n="admin_type"></th><th data-i18n="admin_key"></th><th data-i18n="admin_actions"></th>
</tr></thead><tbody id="tb-lic"></tbody></table>
</div>

<p style="margin-top:16px">
<button class="btn btn-secondary btn-sm" id="adm-out" data-i18n="admin_logout"></button>
<a href="index.html" class="btn btn-secondary btn-sm" data-i18n="nav_home"></a>
</p>
</div>
</div></div>

<script src="lang/fa.js"></script><script src="lang/en.js"></script><script src="js/main.js"></script>
<script>
(function(){
  var P = "ParokhAdmin2026!";
  var K = "parokh_adm_ok";
  function loadUsers(){ try{return JSON.parse(localStorage.getItem('parokh_users')||'{}')}catch(e){return{}} }
  function saveUsers(u){ localStorage.setItem('parokh_users', JSON.stringify(u)); }
  function loadLic(){ try{return JSON.parse(localStorage.getItem('parokh_licenses')||'{}')}catch(e){return{}} }
  function saveLic(u){ localStorage.setItem('parokh_licenses', JSON.stringify(u)); }
  function loadReq(){ try{return JSON.parse(localStorage.getItem('parokh_license_requests')||'{}')}catch(e){return{}} }
  function saveReq(u){ localStorage.setItem('parokh_license_requests', JSON.stringify(u)); }
  function t(key){
    var isFa = document.body.classList.contains('rtl');
    var d = isFa ? (typeof fa!=='undefined'?fa:{}) : (typeof en!=='undefined'?en:{});
    return d[key] || key;
  }
  function render(){
    var users = loadUsers(), lic = loadLic(), req = loadReq();
    document.getElementById('n-users').textContent = Object.keys(users).length;
    document.getElementById('n-lic').textContent = Object.keys(lic).length;
    document.getElementById('n-req').textContent = Object.keys(req).length;
    var tbU = document.getElementById('tb-users');
    var uk = Object.keys(users);
    tbU.innerHTML = uk.length ? uk.map(function(e){
      var n = (users[e]&&users[e].name)||'';
      return '<tr><td>'+e+'</td><td><input data-e="'+e+'" class="edit-name" value="'+n.replace(/"/g,'&quot;')+'" style="width:100%;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text)"></td><td>'+
        '<button class="btn btn-secondary btn-sm save-u" data-e="'+e+'">'+t('admin_save')+'</button> '+
        '<button class="btn btn-secondary btn-sm del-u" data-e="'+e+'">'+t('admin_delete')+'</button></td></tr>';
    }).join('') : '<tr><td colspan="3">'+t('admin_empty')+'</td></tr>';
    tbU.querySelectorAll('.save-u').forEach(function(b){ b.onclick=function(){
      var e=b.dataset.e; var inp=tbU.querySelector('.edit-name[data-e="'+e+'"]');
      var u=loadUsers(); u[e]=u[e]||{}; u[e].name=inp.value.trim(); saveUsers(u); render();
    };});
    tbU.querySelectorAll('.del-u').forEach(function(b){ b.onclick=function(){
      if(!confirm(t('admin_delete')+'?')) return;
      var e=b.dataset.e; var u=loadUsers(); delete u[e]; saveUsers(u);
      var l=loadLic(); delete l[e]; saveLic(l);
      var r=loadReq(); delete r[e]; saveReq(r);
      var deleted=JSON.parse(localStorage.getItem('parokh_deleted_users')||'{}');
      deleted[e]=Date.now(); localStorage.setItem('parokh_deleted_users', JSON.stringify(deleted));
      var orders=JSON.parse(localStorage.getItem('parokh_orders')||'{}'); delete orders[e]; localStorage.setItem('parokh_orders', JSON.stringify(orders));
      render();
    };});
    var tbR = document.getElementById('tb-req');
    var rk = Object.keys(req);
    tbR.innerHTML = rk.length ? rk.map(function(e){
      return '<tr><td>'+e+'</td><td>'+(req[e].name||'')+'</td><td>'+
        '<button class="btn btn-primary btn-sm app-r" data-e="'+e+'" data-t="full">'+t('admin_full')+'</button> '+
        '<button class="btn btn-secondary btn-sm app-r" data-e="'+e+'" data-t="demo">'+t('admin_demo')+'</button> '+
        '<button class="btn btn-secondary btn-sm rej-r" data-e="'+e+'">'+t('admin_delete')+'</button></td></tr>';
    }).join('') : '<tr><td colspan="3">'+t('admin_empty')+'</td></tr>';
    tbR.querySelectorAll('.app-r').forEach(function(b){ b.onclick=function(){
      var e=b.dataset.e, typ=b.dataset.t;
      var key='PG-'+typ.toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Date.now().toString(36).toUpperCase();
      var l=loadLic(); l[e]={key:key,type:typ,at:Date.now()}; saveLic(l);
      var r=loadReq(); delete r[e]; saveReq(r); render();
    };});
    tbR.querySelectorAll('.rej-r').forEach(function(b){ b.onclick=function(){
      var r=loadReq(); delete r[b.dataset.e]; saveReq(r); render();
    };});
    var tbL = document.getElementById('tb-lic');
    var lk = Object.keys(lic);
    tbL.innerHTML = lk.length ? lk.map(function(e){
      return '<tr><td>'+e+'</td><td>'+lic[e].type+'</td><td style="font-family:monospace;font-size:12px">'+lic[e].key+'</td><td>'+
        '<button class="btn btn-secondary btn-sm del-l" data-e="'+e+'">'+t('admin_delete')+'</button></td></tr>';
    }).join('') : '<tr><td colspan="4">'+t('admin_empty')+'</td></tr>';
    tbL.querySelectorAll('.del-l').forEach(function(b){ b.onclick=function(){
      var l=loadLic(); delete l[b.dataset.e]; saveLic(l); render();
    };});
  }
  function openApp(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; render(); }
  if(sessionStorage.getItem(K)==='1') openApp();
  document.getElementById('go').onclick=function(){
    if(document.getElementById('pw').value===P){ sessionStorage.setItem(K,'1'); openApp(); }
    else { var e=document.getElementById('err'); e.style.display='block'; }
  };
  document.getElementById('adm-out').onclick=function(){ sessionStorage.removeItem(K); location.reload(); };
  document.getElementById('iss-btn').onclick=function(){
    var e=document.getElementById('iss-email').value.trim().toLowerCase(); if(!e) return;
    var typ=document.getElementById('iss-type').value;
    var key='PG-'+typ.toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Date.now().toString(36).toUpperCase();
    var l=loadLic(); l[e]={key:key,type:typ,at:Date.now()}; saveLic(l);
    var r=loadReq(); delete r[e]; saveReq(r);
    var o=document.getElementById('iss-out'); o.style.display='block'; o.textContent=key; render();
  };
  document.querySelectorAll('input.with-eye').forEach(function(input){
    var wrap=document.createElement('div'); wrap.className='pass-wrap';
    input.parentNode.insertBefore(wrap,input); wrap.appendChild(input);
    var btn=document.createElement('button'); btn.type='button'; btn.className='pass-eye'; btn.textContent='👁';
    btn.addEventListener('click',function(){ var s=input.type==='password'; input.type=s?'text':'password'; btn.textContent=s?'🙈':'👁'; });
    wrap.appendChild(btn);
  });
  // re-apply i18n after lang toggle for admin dynamic labels
  document.querySelectorAll('[data-lang-toggle]').forEach(function(b){
    b.addEventListener('click', function(){ setTimeout(function(){ if(document.getElementById('app').style.display!=='none') render(); }, 50); });
  });
})();
</script>
</body></html>
