<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Management | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="images/logo-header.png">
</head><body class="rtl">
<header class="header"><div class="container header-inner">
<a class="logo" href="index.html"><img src="images/logo-header.png" width="32" height="32" alt=""><span>PAROKH GOLD EA</span></a>
<div class="header-actions">
<a href="index.html" class="btn btn-secondary btn-sm" data-i18n="nav_home"></a>
<button type="button" class="btn-icon" data-lang-toggle><span>🌐</span></button>
<button type="button" class="btn-icon" data-theme-toggle><span class="theme-icon">☀️</span></button>
</div></div></header>
<div class="dash-wrap"><div class="container">
<div id="gate" class="auth-page" style="min-height:50vh"><div class="auth-card">
<h1 data-i18n="admin_login_title"></h1>
<p class="sub" data-i18n="admin_login_sub"></p>
<div class="form-field"><label data-i18n="admin_pass"></label><input type="password" id="pw" class="with-eye"></div>
<p id="err" style="display:none;color:#f87171;font-size:.9rem"></p>
<button class="btn btn-primary" style="width:100%" id="go" data-i18n="admin_enter"></button>
</div></div>
<div id="app" style="display:none">
<h2 data-i18n="admin_title"></h2>
<p style="color:var(--muted)" data-i18n="admin_sub"></p>
<div class="admin-stats">
<div class="admin-stat"><div class="num" id="n1">0</div><div data-i18n="admin_stat_keys"></div></div>
<div class="admin-stat"><div class="num" id="n2">0</div><div data-i18n="admin_stat_full"></div></div>
<div class="admin-stat"><div class="num" id="n3">0</div><div data-i18n="admin_stat_demo"></div></div>
</div>
<div class="dash-card" style="margin-bottom:14px">
<h3 data-i18n="admin_issue"></h3>
<p data-i18n="admin_issue_hint"></p>
<div class="form-field"><label data-i18n="admin_email"></label><input type="email" id="em"></div>
<div class="form-field"><label data-i18n="admin_type"></label>
<select id="tp"><option value="full" data-i18n="admin_type_full"></option><option value="demo" data-i18n="admin_type_demo"></option></select>
</div>
<button class="btn btn-primary btn-sm" id="gen" data-i18n="admin_gen"></button>
<p id="out" class="license-box" style="display:none;margin-top:10px"></p>
</div>
<div class="dash-card" style="margin-bottom:14px">
<h3 data-i18n="admin_list"></h3>
<table class="admin-table"><thead><tr><th data-i18n="admin_email"></th><th data-i18n="admin_type"></th><th>Key</th><th></th></tr></thead><tbody id="tb"></tbody></table>
</div>
<div class="dash-grid">
<div class="dash-card"><h3 data-i18n="admin_users"></h3><p data-i18n="admin_users_hint"></p>
<a class="btn btn-secondary btn-sm" target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/kklgwyldzpimtzdaleq/auth/users" data-i18n="admin_open_users"></a></div>
<div class="dash-card"><button class="btn btn-secondary btn-sm" id="outbtn" data-i18n="admin_logout"></button></div>
</div>
<p style="margin-top:16px"><a class="btn btn-secondary" href="index.html" data-i18n="admin_back"></a></p>
</div>
</div></div>
<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script><script src="lang/en.js"></script><script src="js/main.js"></script>
<script>
(function(){
  // Password is verified client-side only for UI gate — for production move to Worker Secret
  var P = "ParokhAdmin2026!";
  var K = "parokh_adm";
  var L = "parokh_lics";
  function load(){ try{return JSON.parse(localStorage.getItem(L)||"[]")}catch(e){return[]} }
  function save(a){ localStorage.setItem(L, JSON.stringify(a)); }
  function render(){
    var a=load();
    document.getElementById("n1").textContent=a.length;
    document.getElementById("n2").textContent=a.filter(function(x){return x.t==="full"}).length;
    document.getElementById("n3").textContent=a.filter(function(x){return x.t==="demo"}).length;
    var tb=document.getElementById("tb");
    tb.innerHTML = a.length ? a.map(function(x,i){
      return "<tr><td>"+x.e+"</td><td>"+x.t+"</td><td style=\"font-family:monospace;font-size:12px\">"+x.k+"</td><td><button data-i=\""+i+"\" class=\"btn btn-secondary btn-sm rm\">×</button></td></tr>";
    }).join("") : "<tr><td colspan=\"4\">—</td></tr>";
    tb.querySelectorAll(".rm").forEach(function(b){ b.onclick=function(){ var a=load(); a.splice(+b.dataset.i,1); save(a); render(); }; });
  }
  function openApp(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; render(); }
  if(sessionStorage.getItem(K)==="1") openApp();
  document.getElementById("go").onclick=function(){
    if(document.getElementById("pw").value===P){ sessionStorage.setItem(K,"1"); openApp(); }
    else { var e=document.getElementById("err"); e.style.display="block"; e.textContent=document.body.classList.contains("rtl")?"رمز اشتباه است":"Wrong password"; }
  };
  document.getElementById("outbtn").onclick=function(){ sessionStorage.removeItem(K); location.reload(); };
  document.getElementById("gen").onclick=function(){
    var e=document.getElementById("em").value.trim(); if(!e) return;
    var t=document.getElementById("tp").value;
    var k="PG-"+t.toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Date.now().toString(36).toUpperCase();
    var a=load(); a.unshift({e:e,t:t,k:k,at:Date.now()}); save(a);
    var o=document.getElementById("out"); o.style.display="block"; o.textContent=k; render();
  };
})();
</script>
</body></html>
