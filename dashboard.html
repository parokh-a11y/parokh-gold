<div class="dash-wrap"><div class="container">
<div class="section-header" style="text-align:start;max-width:none;margin-bottom:8px">
<h2 data-i18n="dash_title"></h2>
<p><span data-i18n="dash_welcome"></span> — <strong id="user-name"></strong> (<span id="user-email"></span>)</p>
</div>
<div class="dash-grid">
<div class="dash-card">
<h3 data-i18n="dash_profile"></h3>
<p data-i18n="dash_profile_desc"></p>
<form class="profile-form" id="profile-form">
<div class="form-field"><label data-i18n="dash_name"></label><input type="text" id="p-name"></div>
<div class="form-field"><label data-i18n="dash_email"></label><input type="email" id="p-email" disabled></div>
<button type="submit" class="btn btn-secondary btn-sm" data-i18n="dash_save"></button>
</form>
</div>
<div class="dash-card">
<h3 data-i18n="dash_license"></h3>
<p id="license-status" data-i18n="dash_no_license"></p>
<div class="license-box" id="license-box">—</div>
<button type="button" class="btn btn-primary btn-sm" id="req-license" style="margin-top:12px" data-i18n="dash_request_license"></button>
<p id="req-msg" style="display:none;margin-top:10px;font-size:.9rem;color:#4ade80"></p>
</div>
<div class="dash-card">
<h3 data-i18n="dash_download_demo"></h3>
<p data-i18n="dash_after_disclaimer"></p>

<button type="button" class="btn btn-secondary btn-sm" id="extend-demo" style="margin-top:8px" data-i18n="dash_extend_demo"></button>
<p id="extend-msg" style="display:none;margin-top:8px;font-size:.85rem;color:#4ade80"></p>
</div>
<div class="dash-card">
<h3 data-i18n="dash_download_full"></h3>
<p data-i18n="dash_full_version"></p>
<a href="purchase.html" class="btn btn-primary btn-sm" data-i18n="dash_buy_now"></a>
</div>
<div class="dash-card">
<h3 data-i18n="dash_support"></h3>
<a href="https://t.me/parokh" class="btn btn-secondary btn-sm" target="_blank" rel="noopener">Telegram</a>
</div>
<div class="dash-card">
<h3 data-i18n="nav_logout"></h3>
<button class="btn btn-secondary btn-sm" id="logout-btn" data-i18n="nav_logout"></button>

</div>
</div></div>
<div class="modal-overlay" id="disclaimer-modal"><div class="modal" style="max-width:520px">
<h3 data-i18n="disclaimer_title"></h3>
<div class="disclaimer-box">
<p data-i18n="disclaimer_intro"></p>
<ul style="padding-inline-start:20px;color:var(--text-secondary);font-size:0.9rem;line-height:1.75">
<li data-i18n="disclaimer_1"></li><li data-i18n="disclaimer_2"></li><li data-i18n="disclaimer_3"></li>
<li data-i18n="disclaimer_4"></li><li data-i18n="disclaimer_5"></li><li data-i18n="disclaimer_6"></li>
</ul>
<label style="margin-top:14px;display:flex;gap:10px;cursor:pointer">
<input type="checkbox" id="risk-check"><span data-i18n="disclaimer_accept"></span></label>
</div>
<button class="btn btn-primary" id="risk-accept" style="width:100%;opacity:0.4;pointer-events:none" data-i18n="plan_demo_btn"></button>
<button class="modal-close" data-close-disclaimer data-i18n="modal_close"></button>
</div></div>
<script src="lang/fa.js"></script><script src="lang/en.js"></script><script src="js/main.js"></script>
<script>
(function(){
  var email = localStorage.getItem('parokh_session');
  if(!email){ location.href='login.html'; return; }
  var deleted = JSON.parse(localStorage.getItem('parokh_deleted_users')||'{}');
  if(deleted[email]){ localStorage.removeItem('parokh_session'); location.href='login.html'; return; }
  var users = JSON.parse(localStorage.getItem('parokh_users')||'{}');
  if(!users[email]){ localStorage.removeItem('parokh_session'); location.href='login.html'; return; }
  var u = users[email];
  var licenses = JSON.parse(localStorage.getItem('parokh_licenses')||'{}');
  var requests = JSON.parse(localStorage.getItem('parokh_license_requests')||'{}');
  document.getElementById('user-email').textContent = email;
  document.getElementById('user-name').textContent = u.name || '';
  document.getElementById('p-name').value = u.name || '';
  document.getElementById('p-email').value = email;
  function isFa(){ return document.body.classList.contains('rtl'); }
  function refreshLicense(){
    var box = document.getElementById('license-box');
    var st = document.getElementById('license-status');
    var btn = document.getElementById('req-license');
    if(licenses[email] && licenses[email].key){
      box.textContent = licenses[email].key + ' (' + (licenses[email].type||'') + ')';
      st.textContent = isFa() ? 'لایسنس فعال' : 'Active license';
      if(btn) btn.style.display='none';
    } else if(requests[email]){
      box.textContent = '—';
      st.textContent = isFa() ? (fa.dash_request_pending||'در انتظار') : (en.dash_request_pending||'Pending');
    } else {
      box.textContent = '—';
    }
  }
  refreshLicense();
  document.getElementById('profile-form').addEventListener('submit', function(e){
    e.preventDefault();
    users[email].name = document.getElementById('p-name').value.trim();
    localStorage.setItem('parokh_users', JSON.stringify(users));
    document.getElementById('user-name').textContent = users[email].name;
    alert(isFa() ? 'ذخیره شد' : 'Saved');
  });
  document.getElementById('req-license').addEventListener('click', function(){
    if(licenses[email] && licenses[email].key) return;
    requests[email] = { email: email, name: users[email].name||'', at: Date.now(), status: 'pending' };
    localStorage.setItem('parokh_license_requests', JSON.stringify(requests));
    var msg = document.getElementById('req-msg');
    msg.style.display='block';
    msg.textContent = isFa() ? (fa.dash_request_sent||'') : (en.dash_request_sent||'');
    refreshLicense();
  });
  document.getElementById('extend-demo').addEventListener('click', function(){
    var msg = document.getElementById('extend-msg');
    msg.style.display='block';
    if(users[email].demoExtended){
      msg.style.color='#f87171';
      msg.textContent = isFa() ? (fa.dash_extend_used||'') : (en.dash_extend_used||'');
      return;
    }
    users[email].demoExtended = true;
    users[email].demoExtendAt = Date.now();
    localStorage.setItem('parokh_users', JSON.stringify(users));
    msg.style.color='#4ade80';
    msg.textContent = isFa() ? (fa.dash_extend_done||'') : (en.dash_extend_done||'');
  });
  document.getElementById('logout-btn').addEventListener('click', function(){
    localStorage.removeItem('parokh_session');
    location.href='index.html';
  });
})();
</script>
</body></html>
