<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Dashboard | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo-header.png" type="image/png">
</head>
<body class="rtl">
<header class="header"><div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo-header.png" alt="PAROKH GOLD EA" class="logo-img" width="34" height="34"><span>PAROKH GOLD EA</span></a>
<div class="header-actions">
<a href="index.html" class="btn btn-secondary btn-sm" data-i18n="nav_home">خانه</a>
<button class="btn-icon" data-lang-toggle><span class="lang-label">🌐</span></button>
<button class="btn-icon" data-theme-toggle><span class="theme-icon">☀️</span></button>
</div></div></header>
<div class="dash-wrap"><div class="container">
<div class="section-header" style="text-align:start;max-width:none;margin-bottom:8px">
<h2 data-i18n="dash_title">پنل کاربری</h2>
<p><span data-i18n="dash_welcome"></span> — <strong id="user-name">...</strong> (<span id="user-email">...</span>)</p>
</div>
<div class="dash-grid">
<div class="dash-card">
<h3>پروفایل</h3>
<div class="form-field"><label data-i18n="reg_name"></label><input type="text" id="p-name"></div>
<button class="btn btn-secondary btn-sm" id="save-profile">ذخیره</button>
</div>
<div class="dash-card">
<h3 data-i18n="dash_license"></h3>
<p data-i18n="dash_no_license"></p>
<div class="license-box">—</div>
</div>
<div class="dash-card">
<h3 data-i18n="dash_download_demo"></h3>
<a href="index.html#pricing" class="btn btn-secondary btn-sm" data-i18n="plan_demo_btn"></a>
</div>
<div class="dash-card">
<h3 data-i18n="dash_support"></h3>
<a href="https://t.me/parokh" class="btn btn-secondary btn-sm" target="_blank" rel="noopener">Telegram</a>
</div>
<div class="dash-card">
<h3 data-i18n="nav_logout"></h3>
<button class="btn btn-secondary btn-sm" id="logout-btn" data-i18n="nav_logout"></button>
</div>
</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
<script>
(async function(){
  var session = await parokhRequireAuth();
  if(!session) return;
  var user = session.user;
  var meta = user.user_metadata || {};
  document.getElementById("user-email").textContent = user.email || "";
  document.getElementById("user-name").textContent = meta.full_name || (user.email||"").split("@")[0];
  document.getElementById("p-name").value = meta.full_name || "";
  document.getElementById("save-profile").addEventListener("click", async function(){
    var name = document.getElementById("p-name").value.trim();
    var res = await getParokhSupabase().auth.updateUser({ data: { full_name: name } });
    if(res.error){ alert(res.error.message); return; }
    document.getElementById("user-name").textContent = name;
    alert(document.body.classList.contains("rtl") ? "ذخیره شد" : "Saved");
  });
  document.getElementById("logout-btn").addEventListener("click", async function(){
    await getParokhSupabase().auth.signOut();
    location.href = "index.html";
  });
})();
</script>
</body></html>
