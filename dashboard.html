<div class="dash-wrap"><div class="container">
<h2 data-i18n="dash_title"></h2>
<p><span data-i18n="dash_welcome"></span> — <strong id="user-name">...</strong> (<span id="user-email"></span>)</p>
<div class="dash-grid" style="margin-top:16px">
<div class="dash-card"><h3 data-i18n="reg_name"></h3>
<div class="form-field"><input id="p-name"></div>
<button class="btn btn-secondary btn-sm" id="save-profile">Save</button></div>
<div class="dash-card"><h3 data-i18n="dash_license"></h3>
<p data-i18n="dash_no_license"></p><div class="license-box" id="license-box">—</div></div>
<div class="dash-card"><h3 data-i18n="dash_support"></h3>
<a class="btn btn-secondary btn-sm" href="https://t.me/parokh" target="_blank" rel="noopener">Telegram</a></div>
<div class="dash-card"><h3 data-i18n="nav_logout"></h3>
<button class="btn btn-secondary btn-sm" id="logout-btn" data-i18n="nav_logout"></button></div>
</div></div></div>
<script src="lang/fa.js"></script><script src="lang/en.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script><script src="js/main.js"></script>
<script>
(async function(){
  var session = await parokhRequireAuth(); if(!session) return;
  var u = session.user, m = u.user_metadata||{};
  document.getElementById("user-email").textContent = u.email||"";
  document.getElementById("user-name").textContent = m.full_name||(u.email||"").split("@")[0];
  document.getElementById("p-name").value = m.full_name||"";
  document.getElementById("save-profile").onclick = async function(){
    var name = document.getElementById("p-name").value.trim();
    var res = await getParokhSupabase().auth.updateUser({ data: { full_name: name } });
    if(res.error) alert(res.error.message); else document.getElementById("user-name").textContent = name;
  };
  document.getElementById("logout-btn").onclick = async function(){
    await getParokhSupabase().auth.signOut(); location.href="index.html";
  };
})();
</script>
</body></html>
