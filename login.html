<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Login | PAROKH GOLD EA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo-header.png" type="image/png">
</head>
<body class="rtl">
<header class="header"><div class="container header-inner">
<a href="index.html" class="logo"><img src="images/logo-header.png" alt="PAROKH GOLD EA" class="logo-img" width="34" height="34"><span>PAROKH GOLD EA</span></a>
<div class="header-actions">
<a href="login.html" class="btn btn-secondary btn-sm" data-i18n="nav_login">ورود</a>
<button class="btn-icon" data-lang-toggle><span class="lang-label">🌐</span></button>
<button class="btn-icon" data-theme-toggle><span class="theme-icon">☀️</span></button>
</div></div></header>
<div class="auth-page"><div class="auth-card">
<img src="images/logo-header.png" alt="PAROKH GOLD EA" style="width:48px;height:48px;margin:0 auto 16px;display:block;border-radius:10px">
<h1 data-i18n="login_title">ورود</h1>
<p class="sub" data-i18n="login_subtitle"></p>
<form id="login-form">
<div class="form-field"><label data-i18n="login_email"></label><input type="email" id="email" required autocomplete="email"></div>
<div class="form-field"><label data-i18n="login_password"></label><input type="password" id="password" required minlength="6" autocomplete="current-password"></div>
<p id="auth-msg" style="display:none;font-size:0.9rem;margin-bottom:12px;color:#f87171"></p>
<button type="submit" class="btn btn-primary" style="width:100%" id="login-btn" data-i18n="login_btn">ورود</button>
</form>
<p class="auth-divider" data-i18n="login_or">یا</p>
<a href="register.html" class="btn btn-secondary" style="width:100%;display:flex" data-i18n="login_register">ثبت‌نام</a>
<p style="text-align:center;margin-top:16px"><a href="index.html" data-i18n="btn_home"></a></p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
<script>
(async function(){
  var sb = getParokhSupabase();
  if(sb){
    var s = await sb.auth.getSession();
    if(s.data.session) location.href = "dashboard.html";
  }
  document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();
    var msg = document.getElementById("auth-msg");
    var btn = document.getElementById("login-btn");
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    msg.style.display = "none";
    btn.disabled = true;
    try {
      var res = await getParokhSupabase().auth.signInWithPassword({ email: email, password: password });
      if(res.error) throw res.error;
      location.href = "dashboard.html";
    } catch(err) {
      msg.style.display = "block";
      var isFa = document.body.classList.contains("rtl");
      var m = (err && err.message) ? err.message : "Error";
      if(m.indexOf("Invalid login") >= 0) m = isFa ? "ایمیل یا رمز اشتباه است" : "Invalid email or password";
      if(m.indexOf("Email not confirmed") >= 0) m = isFa ? "ابتدا ایمیل خود را تأیید کنید" : "Please confirm your email first";
      msg.textContent = m;
      btn.disabled = false;
    }
  });
})();
</script>
</body></html>
