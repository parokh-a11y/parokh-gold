<div class="auth-page"><div class="auth-card">
<img src="images/logo-header.png" alt="" width="48" height="48" style="margin:0 auto 16px;display:block;border-radius:10px">
<h1 data-i18n="login_title">ورود</h1>
<p class="sub" data-i18n="login_subtitle"></p>
<form id="login-form">
<div class="form-field"><label data-i18n="login_email"></label><input type="email" id="email" required autocomplete="email"></div>
<div class="form-field"><label data-i18n="login_password"></label><input type="password" id="password" class="with-eye" required minlength="6" autocomplete="current-password"></div>
<p id="auth-msg" style="display:none;font-size:.9rem;margin-bottom:12px;color:#f87171"></p>
<button type="submit" class="btn btn-primary" style="width:100%" id="login-btn" data-i18n="login_btn">ورود</button>
</form>
<p class="auth-divider" data-i18n="login_or">یا</p>
<a href="register.html" class="btn btn-secondary" style="width:100%;display:flex" data-i18n="login_register">ثبت‌نام</a>
<p style="text-align:center;margin-top:16px"><a href="index.html" data-i18n="btn_home"></a></p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="lang/fa.js"></script>
<script src="lang/en.js"></script>
<script src="js/main.js"></script>
<script>
(async function(){
  var sb=getParokhSupabase();
  if(sb){ var s=await sb.auth.getSession(); if(s.data.session) location.href="dashboard.html"; }
  document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();
    var msg=document.getElementById("auth-msg"), btn=document.getElementById("login-btn");
    var isFa=document.body.classList.contains("rtl");
    msg.style.display="none"; btn.disabled=true;
    try {
      var res=await getParokhSupabase().auth.signInWithPassword({
        email:document.getElementById("email").value.trim(),
        password:document.getElementById("password").value
      });
      if(res.error) throw res.error;
      location.href="dashboard.html";
    } catch(err) {
      msg.style.display="block"; msg.textContent=parokhAuthErrorMessage(err,isFa); btn.disabled=false;
    }
  });
})();
</script>
